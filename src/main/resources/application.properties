spring.application.name=travel-diary-backend

# MySQL 연결
spring.datasource.url=jdbc:mysql://localhost:3306/travel_diary?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${TRAVEL_DIARY_DB_USERNAME}
spring.datasource.password=${TRAVEL_DIARY_DB_PASSWORD}

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 기본 오류 응답 보안 설정
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# JWT 설정
app.jwt.secret=${TRAVEL_DIARY_JWT_SECRET}
app.jwt.issuer=travel-diary-backend
app.jwt.access-token-expiration-seconds=3600

# 파일 업로드 설정
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.6-flash

app.cors.allowed-origin-patterns=http://localhost:5173,http://*:5173

kakao.rest-api-key=${KAKAO_REST_API_KEY}